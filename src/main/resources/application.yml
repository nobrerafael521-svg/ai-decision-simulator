server:
  port: 8080

spring:
  application:
    name: ai-decision-simulator
  datasource:
    url: jdbc:h2:file:./data/simulator;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
